[workspace]
members = [
  "crates/kotoba-core",
  "crates/kotoba-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
authors = ["Satonix"]
repository = "https://github.com/Satonix/KotobaParse"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
