[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotobaparse"
version = "0.3.0a2"
description = "Retired Python compatibility package; KotobaParse runtime is Rust-only."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SekaiTranslator Project" }]
license = { text = "MIT" }
keywords = ["visual-novel", "parser", "translation", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["kotobaparse*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[project.urls]
Homepage = "https://github.com/YOUR_USER/KotobaParse"
Repository = "https://github.com/YOUR_USER/KotobaParse"
Issues = "https://github.com/YOUR_USER/KotobaParse/issues"
